# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# `prek install` sets up every stage the hooks below use (commitizen runs at
# commit-msg), not only pre-commit.
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending" },
    { id = "fix-byte-order-marker" },
    { id = "check-added-large-files" },
    { id = "check-case-conflict" },
    { id = "check-merge-conflict" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-symlinks" },
    { id = "destroyed-symlinks" },
    { id = "check-executables-have-shebangs" },
    { id = "check-shebang-scripts-are-executable" },
    { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3"
hooks = [
    { id = "ruff-check", args = ["--fix"] },
    { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.19.3"
hooks = [
    { id = "commitizen" },        # commit-msg stage
    { id = "commitizen-branch" }, # pre-push stage
]

[[repos]]
repo = "https://github.com/rohaquinlop/complexipy-pre-commit"
rev = "v8.3.0"
hooks = [{ id = "complexipy" }]


[[repos]]
repo = "local"
hooks = [
    { id = "uv-lock", name = "uv lock --check", entry = "uv lock --check", language = "system", files = '^(pyproject\.toml|uv\.lock)$', pass_filenames = false },
    { id = "deptry", name = "deptry (dependencies)", entry = "uv run deptry .", language = "system", files = '^(pyproject\.toml|uv\.lock|src/.*\.pyi?|tests/.*\.py)$', pass_filenames = false },
    { id = "typos", name = "typos (spell check)", entry = "uv run typos --force-exclude", language = "system", types = ["text"] },
    { id = "rumdl", name = "rumdl (markdown)", entry = "uv run rumdl check --fix", language = "system", types = ["markdown"] },
    { id = "jscpd", name = "jscpd (duplicate code)", entry = "uv run jscpd src tests", language = "system", types_or = ["python"], pass_filenames = false },
    { id = "pyrefly", name = "pyrefly check", entry = "uv run pyrefly check", language = "system", types_or = ["python", "pyi"], pass_filenames = false },
    { id = "pytest", name = "pytest (coverage)", entry = "uv run pytest --cov", language = "system", types_or = ["python", "pyi"], pass_filenames = false },
]
