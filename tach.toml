# Configuration file for `tach`, which checks the dependency direction between
# the packages of `src/wio`, and between `scripts` and the groups of `tests`.
# See https://docs.gauge.sh/ for more information.
#
# The table is the dependency direction that src/wio/README.md states and
# explains. Ports are imported only under `TYPE_CHECKING`, so type-only imports
# count. `exact` stays off: it would fail on declared dependencies that no code
# uses yet. The overlapping source roots make tach 0.35.3 pass a forbidden import in
# some runs; see docs/known-issues.md.

source_roots = ["src", "."]
exact = false
ignore_type_checking_imports = false

# Plain data: it imports nothing from wio. Parsing and validation that can fail
# live in wio.formats, so a model never raises a WioError.
[[modules]]
path = "wio.models"
depends_on = []

# Errors that several packages share. They may carry models, so it imports
# wio.models and nothing else from wio; every other package may import it.
[[modules]]
path = "wio.errors"
depends_on = ["wio.models"]

[[modules]]
path = "wio.env"
depends_on = ["wio.errors"]

[[modules]]
path = "wio.formats"
depends_on = ["wio.models", "wio.errors"]

[[modules]]
path = "wio.io"
depends_on = ["wio.models", "wio.errors"]

# A stub-only module: tach reads no `.pyi` file, but enforces its imports.
[[modules]]
path = "wio.ports"
depends_on = ["wio.models", "wio.errors"]

# Adapters: only `wio.cli` and the unit and integration tests may import them.
[[modules]]
path = "wio.io.adapters"
depends_on = ["wio.io", "wio.env", "wio.models", "wio.errors"]
visibility = ["wio.cli", "tests.unit", "tests.integration"]

[[modules]]
path = "wio.env.adapters"
depends_on = ["wio.env", "wio.errors"]
visibility = ["wio.cli", "tests.unit", "tests.integration"]

# Components: they never import one another, and meet only in `wio.cli`.
[[modules]]
path = "wio.config"
depends_on = ["wio.models", "wio.formats", "wio.io", "wio.env", "wio.ports", "wio.errors"]

[[modules]]
path = "wio.contracts"
depends_on = ["wio.models", "wio.formats", "wio.io", "wio.env", "wio.ports", "wio.errors"]

[[modules]]
path = "wio.templates"
depends_on = ["wio.models", "wio.formats", "wio.io", "wio.env", "wio.ports", "wio.errors"]

[[modules]]
path = "wio.rules"
depends_on = ["wio.models", "wio.formats", "wio.io", "wio.env", "wio.ports", "wio.errors"]

[[modules]]
path = "wio.trailers"
depends_on = ["wio.models", "wio.formats", "wio.io", "wio.env", "wio.ports", "wio.errors"]

[[modules]]
path = "wio.log"
depends_on = ["wio.models", "wio.formats", "wio.io", "wio.env", "wio.ports", "wio.errors"]

[[modules]]
path = "wio.context"
depends_on = ["wio.models", "wio.formats", "wio.io", "wio.env", "wio.ports", "wio.errors"]

[[modules]]
path = "wio.cli"
depends_on = [
    "wio.errors",
    "wio.models",
    "wio.formats",
    "wio.io",
    "wio.io.adapters",
    "wio.env",
    "wio.env.adapters",
    "wio.ports",
    "wio.config",
    "wio.contracts",
    "wio.rules",
    "wio.trailers",
    "wio.log",
    "wio.context",
]

# The repository's own scripts. They import nothing from `src/wio` or `tests`.
[[modules]]
path = "scripts"
depends_on = []

# Shared test helpers: a sandbox, and helpers built on it.
[[modules]]
path = "tests.sandbox"
depends_on = []

[[modules]]
path = "tests.support"
depends_on = ["tests.sandbox"]

[[modules]]
path = "tests.conftest"
depends_on = ["tests.sandbox"]

# The acceptance setup: the `Wio` facade over test drivers that reach `wio`.
[[modules]]
path = "tests.acceptance"
depends_on = ["tests.acceptance.dsl", "tests.acceptance.drivers", "tests.sandbox"]

[[modules]]
path = "tests.acceptance.dsl"
depends_on = ["tests.acceptance.drivers"]

[[modules]]
path = "tests.acceptance.drivers"
depends_on = ["tests.sandbox", "wio.cli", "wio.io"]

# Tests of `scripts`: they never use the acceptance setup.
[[modules]]
path = "tests.scripts"
depends_on = ["scripts", "tests.sandbox", "tests.support"]

[[modules]]
path = "tests.packaging"
depends_on = []

# Unit tests may import what they test, and the acceptance setup they test.
[[modules]]
path = "tests.unit"
depends_on = [
    "wio.errors",
    "wio.models",
    "wio.formats",
    "tests.acceptance",
    "tests.acceptance.dsl",
    "tests.acceptance.drivers",
    "tests.sandbox",
    "tests.support",
    "wio.cli",
    "wio.config",
    "wio.env",
    "wio.env.adapters",
    "wio.formats",
    "wio.io",
    "wio.io.adapters",
    "wio.ports",
]

# Integration tests meet the adapters, and the code that has something real
# behind it, with the shared helpers. They never use the unit tests.
[[modules]]
path = "tests.integration"
depends_on = [
    "wio.cli",
    "wio.config",
    "wio.env",
    "wio.env.adapters",
    "wio.errors",
    "wio.io",
    "wio.io.adapters",
    "tests.acceptance.drivers",
    "tests.sandbox",
    "tests.support",
]

# Tooling tests probe the repository's own configuration with its own tools,
# and the test setup, such as the channel marker of the acceptance tests.
[[modules]]
path = "tests.tooling"
depends_on = ["tests.acceptance"]
