# Rule presets that include one another, one that includes itself, and one that
# excludes another that includes it.

[rule_presets.a]
rules_include = ["b"]

[rule_presets.b]
rules_include = ["a"]

[rule_presets.s]
rules_include = ["s"]

[rule_presets.x]
rules_exclude = ["y"]

[rule_presets.y]
rules_include = ["x"]
