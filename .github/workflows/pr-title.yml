name: PR title

# Squash merging turns the pull request title into the commit message on
# main, so the title must follow Conventional Commits. `edited` re-runs the
# check when the title changes.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run cz check --message "$PR_TITLE"
