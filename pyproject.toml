[project]
name = "work-it-out"
version = "0.0.1"
readme = "README.md"
description = "Work It Out! Agentic Workflow"
authors = [
    { name = "Michal Sitarz", email = "28092472+msitarz@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "rumdl>=0.3.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wio"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pyrefly]
project_includes = [
  "src",
  "tests",
]
search_path = ["src", "."]
python_version = "3.15"
preset = "strict"

[tool.pytest]
minversion = "9.0"
strict = true  # strict config, markers, xfail and parametrization ids
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "channels(*channels): run once per listed Channel",
    "slow: spawns the real CLI",
]
addopts = [
  "-ra",
  "--tb=short",
  "--import-mode=importlib",
]

[tool.coverage.run]
branch = true
source = ["src/wio"]
omit = [
  "src/wio/__init__.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "raise NotImplementedError",
  "\\.\\.\\.\\s*$",           # ellipsis stub bodies (Protocols, overloads)
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true  # preview only enables rules selected by exact code
unfixable = ["ERA001"]  # --fix must not delete commented-out code
extend-select = [
    "ANN",   # annotations everywhere, tests included
    "ARG",   # unused arguments
    "A",     # builtin shadowing
    "B",     # bugbear
    "C901",  # McCabe complexity (default limit 10); complexipy covers cognitive complexity
    "D",     # docstrings (google convention below)
    "EM",    # exception message style
    "ERA",   # commented-out code
    "FBT",   # boolean positional arguments
    "I",     # import sorting
    "N",     # pep8-naming
    "PERF",  # performance anti-patterns
    "PT",    # pytest style
    "PTH",   # pathlib over os / os.path
    "RET",   # return consistency
    "SIM",   # simplifications
    "PLR0916",  # too many boolean expressions in an if (preview rule)
    "SLF",   # private member access
    "TC",    # typing-only imports under TYPE_CHECKING
    "T20",   # print / pprint: write to sys.stdout instead
    "TID",   # banned / relative imports
    "UP",    # pyupgrade
]

[tool.ruff.lint.pylint]
max-statements = 20
max-bool-expr = 3

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true  # test_* and other None-returning functions need no `-> None`

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["wio"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]
"*.pyi" = ["PYI048", "PIE790"]  # stubs carry a docstring plus `...`

[tool.rumdl]
line-length = 80
respect-gitignore = true

[tool.rumdl.MD013]
reflow = true
code_blocks = false  # code is formatted by ruff, not rumdl
tables = false

[tool.complexipy]
max-complexity-allowed = 7

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "complexipy>=8.3.0",
    "debugpy>=1.8.22",
    "jscpd>=5.4.2",
    "prek>=0.5.9",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "tach>=0.35.3",
    "typos>=1.51.1",
]
