[project]
name = "work-it-out"
version = "0.0.1"
readme = "README.md"
description = "Work It Out! Agentic Workflow"
authors = [
    { name = "Michal Sitarz", email = "28092472+msitarz@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wio"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pyrefly]
project_includes = [
  "src",
  "tests",
]
search_path = ["src", "."]
python_version = "3.15"
preset = "strict"

[tool.pytest]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "channels(*channels): run once per listed Channel",
    "slow: spawns the real CLI",
]
addopts = [
  "--strict-markers",
  "--tb=short",
  "--import-mode=importlib",
]

[tool.coverage.run]
branch = true
source = ["src/wio"]
omit = [
  "src/wio/__init__.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "raise NotImplementedError",
  "\\.\\.\\.\\s*$",           # ellipsis stub bodies (Protocols, overloads)
]

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "complexipy>=8.3.0",
    "debugpy>=1.8.22",
    "jscpd>=5.4.2",
    "prek>=0.5.9",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "tach>=0.35.3",
]
